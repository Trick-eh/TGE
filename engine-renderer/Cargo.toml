[package]
name = "engine-renderer"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
bytemuck = "1.25.0"
engine-math = { version = "0.1.0", path = "../engine-math" }
glow = "0.17"
image = "0.25.10"
fontdue = "0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
glutin = "0.32"
glutin-winit = "0.5"
winit = { version = "0.30", features = ["wayland"] }

ash = { version = "0.38", optional = true }
ash-window = { version = "0.13", optional = true }
raw-window-handle = "0.6"

[features]
default = ["opengl"]
opengl = []
vulkan = ["dep:ash", "dep:ash-window"]
